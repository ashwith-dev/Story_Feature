<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="min-h-screen antialiased">
    <main class="mx-auto w-full max-w-xl px-4 pb-16 pt-8 sm:px-6 sm:pt-12">
      <header class="mb-6 sm:mb-8">
        <p class="brand text-3xl tracking-tight text-neutral-900 sm:text-4xl">
          Stories
        </p>
        <p class="mt-1 text-sm text-neutral-500 sm:text-base">
          Share a moment — it fades in 24 hours.
        </p>
      </header>

      <!-- Story tray -->
      <section
        aria-label="Story tray"
        class="rounded-2xl bg-white px-3 py-3 shadow-sm ring-1 ring-black/5 sm:px-4 sm:py-4"
      >
        <div
          id="story-tray"
          class="story-tray-scroll flex items-center gap-3 overflow-x-auto pb-1"
        >
          <!-- Add story (+) — always first -->
          <label
            id="btn-add-story"
            class="add-story"
            title="Add story"
            aria-label="Add story"
          >
            <input
              id="file-input"
              type="file"
              accept="image/*"
              class="sr-only"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 5v14M5 12h14"
              />
            </svg>
          </label>

          <!-- Mock stories: newest first. Unseen then seen examples. -->
          <button
            type="button"
            class="story-circle story-ring ring-unseen"
            data-story-id="story-1"
            aria-label="View story 1"
          >
            <span class="story-ring__inner">
              <img
                class="story-ring__thumb"
                src="https://picsum.photos/seed/story1/128/128"
                alt=""
                width="64"
                height="64"
              />
            </span>
          </button>

          <button
            type="button"
            class="story-circle story-ring ring-unseen"
            data-story-id="story-2"
            aria-label="View story 2"
          >
            <span class="story-ring__inner">
              <img
                class="story-ring__thumb"
                src="https://picsum.photos/seed/story2/128/128"
                alt=""
                width="64"
                height="64"
              />
            </span>
          </button>

          <button
            type="button"
            class="story-circle story-ring ring-unseen"
            data-story-id="story-3"
            aria-label="View story 3"
          >
            <span class="story-ring__inner">
              <img
                class="story-ring__thumb"
                src="https://picsum.photos/seed/story3/128/128"
                alt=""
                width="64"
                height="64"
              />
            </span>
          </button>

          <button
            type="button"
            class="story-circle story-ring ring-seen"
            data-story-id="story-4"
            aria-label="View story 4 (seen)"
          >
            <span class="story-ring__inner">
              <img
                class="story-ring__thumb"
                src="https://picsum.photos/seed/story4/128/128"
                alt=""
                width="64"
                height="64"
              />
            </span>
          </button>

          <button
            type="button"
            class="story-circle story-ring ring-seen"
            data-story-id="story-5"
            aria-label="View story 5 (seen)"
          >
            <span class="story-ring__inner">
              <img
                class="story-ring__thumb"
                src="https://picsum.photos/seed/story5/128/128"
                alt=""
                width="64"
                height="64"
              />
            </span>
          </button>

          <button
            type="button"
            class="story-circle story-ring ring-seen"
            data-story-id="story-6"
            aria-label="View story 6 (seen)"
          >
            <span class="story-ring__inner">
              <img
                class="story-ring__thumb"
                src="https://picsum.photos/seed/story6/128/128"
                alt=""
                width="64"
                height="64"
              />
            </span>
          </button>
        </div>
      </section>

      <!-- Upload rejection message (hidden until JS shows it) -->
      <p
        id="upload-error"
        class="upload-error mt-3"
        role="alert"
        hidden
      >
        Image is too large. Max size is 1080 × 1920.
      </p>
    </main>

    <!--
      Story viewer overlay — left visible for HTML/CSS design review.
      Before the JS phase, add the `hidden` attribute (or class) to #viewer.
      Desktop: left/right half hit zones will be wired in JS (no visible chrome).
    -->
    <div
      id="viewer"
      class="viewer"
      role="dialog"
      aria-modal="true"
      aria-label="Story viewer"
    >
      <div id="viewer-backdrop" class="viewer-backdrop" aria-hidden="true"></div>

      <div id="viewer-frame" class="viewer-frame">
        <div
          id="progress-segments"
          class="progress-segments"
          aria-hidden="true"
        >
          <!-- Mock stack from opened story onward: complete / active / upcoming -->
          <div class="progress-segment is-complete">
            <span class="progress-segment__fill"></span>
          </div>
          <div class="progress-segment is-active">
            <span class="progress-segment__fill"></span>
          </div>
          <div class="progress-segment">
            <span class="progress-segment__fill"></span>
          </div>
        </div>

        <button
          id="viewer-close"
          type="button"
          class="viewer-close"
          aria-label="Close story"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.25"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>

        <div class="viewer-image-wrap">
          <img
            id="viewer-image"
            src="https://picsum.photos/seed/viewer/1080/1920"
            alt="Story"
            width="1080"
            height="1920"
          />
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
